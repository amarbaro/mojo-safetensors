# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.4

package:
  name: "mojo-safetensors"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/safetensors -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/safetensors.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-json
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - mojo-json

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-safetensors
  license: Apache-2.0
  license_file: LICENSE
  summary: Read (mmapped, zero copy) and write safetensors files from Mojo, as the reference does
  repository: https://github.com/amarbaro/mojo-safetensors

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-safetensors
